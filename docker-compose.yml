services:
  # PostgreSQL 数据库 - 包含在 Docker 中，无需本地安装
  postgres:
    image: postgres:17-alpine
    container_name: ewlogistics-postgres
    environment:
      - POSTGRES_DB=ewlogistics
      - POSTGRES_USER=ewadmin
      - POSTGRES_PASSWORD=ewlogistics2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 自动初始化脚本（首次启动时执行）
      - ./database_backup_20251119/database_export/init-database.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./database_backup_20251119/database_export/complete_database_dump.sql:/docker-entrypoint-initdb.d/complete_database_dump.sql:ro
      - ./database_backup_20251119/database_export:/docker-entrypoint-initdb.d/csv_data:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewadmin -d ewlogistics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ewlogistics-backend
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - ENV_MODE=${ENV_MODE:-local}
      - AUTH_MODE=${AUTH_MODE:-mock}
      - PORT=5001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ewlogistics
      - DB_USER=ewadmin
      - DB_PASSWORD=ewlogistics2024
      - JWT_SECRET=dev-secret-key-change-in-production
      - FRONTEND_URL=http://localhost:3000
      - MOCK_USER_ID=${MOCK_USER_ID:-1}
      - MOCK_USER_EMAIL=${MOCK_USER_EMAIL:-dev@ewltl.com}
      - MOCK_USER_CREDITS=${MOCK_USER_CREDITS:-9999}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # 员工服务 (微服务)
  employee-service:
    build:
      context: ./employee-service
      dockerfile: Dockerfile
    container_name: ewlogistics-employee-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ewlogistics
      - DB_USER=ewadmin
      - DB_PASSWORD=ewlogistics2024
      - COGNITO_REGION=us-east-1
      - COGNITO_USER_POOL_ID=us-east-1_HU9W7uLQA
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./employee-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ewlogistics-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001/api
      - REACT_APP_EMPLOYEE_API_URL=http://localhost:3001/api
      - REACT_APP_AUTH_MODE=mock
      - REACT_APP_GOOGLE_MAPS_API_KEY=AIzaSyB-uQvzsiFeJOr37qYg2EenJbaKUG7-KfE
      - HOST=0.0.0.0
    depends_on:
      - backend
      - employee-service
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network
    restart: unless-stopped

  # Redis (可选，用于缓存)
  redis:
    image: redis:7-alpine
    container_name: ewlogistics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
