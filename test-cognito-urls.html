<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>测试Cognito URLs</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .url-box { background: #f0f0f0; padding: 15px; margin: 10px 0; border-radius: 5px; word-break: break-all; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        h1 { color: #333; }
        button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Cognito URLs 测试</h1>
    
    <h2>配置信息</h2>
    <div class="url-box">
        <strong>域名前缀:</strong> us-east-1hu9w7ulqa<br>
        <strong>区域:</strong> us-east-1<br>
        <strong>Client ID:</strong> 5mae63uesfb6dia5l06ju4j5m0
    </div>
    
    <h2>生成的URLs</h2>
    <div id="urls"></div>
    
    <h2>测试按钮</h2>
    <button onclick="testSignUp()">测试注册页面</button>
    <button onclick="testSignIn()">测试登录页面</button>
    
    <script>
        const config = {
            domain: 'us-east-1hu9w7ulqa',
            region: 'us-east-1',
            clientId: '5mae63uesfb6dia5l06ju4j5m0',
            redirectSignIn: window.location.origin + '/login',
            responseType: 'code',
            scope: ['email', 'openid', 'phone', 'profile']
        };
        
        function generateUrls() {
            const baseUrl = `https://${config.domain}.auth.${config.region}.amazoncognito.com`;
            const scopeString = config.scope.join('+');
            const encodedRedirectUri = encodeURIComponent(config.redirectSignIn);
            
            const urls = {
                signUp: `${baseUrl}/signup?client_id=${config.clientId}&response_type=${config.responseType}&scope=${scopeString}&redirect_uri=${encodedRedirectUri}`,
                signIn: `${baseUrl}/login?client_id=${config.clientId}&response_type=${config.responseType}&scope=${scopeString}&redirect_uri=${encodedRedirectUri}`
            };
            
            const urlsDiv = document.getElementById('urls');
            urlsDiv.innerHTML = `
                <div class="url-box success">
                    <strong>注册URL:</strong><br>
                    ${urls.signUp}
                </div>
                <div class="url-box success">
                    <strong>登录URL:</strong><br>
                    ${urls.signIn}
                </div>
            `;
            
            return urls;
        }
        
        const urls = generateUrls();
        
        function testSignUp() {
            window.open(urls.signUp, '_blank');
        }
        
        function testSignIn() {
            window.open(urls.signIn, '_blank');
        }
    </script>
</body>
</html>
