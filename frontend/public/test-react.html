<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>测试React部署</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test-section { background: #f0f0f0; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>React应用部署测试</h1>
    
    <div class="test-section">
        <h2>1. 检查静态文件</h2>
        <p>如果您能看到这个页面，说明静态文件服务正常。</p>
    </div>
    
    <div class="test-section" id="reactCheck">
        <h2>2. 检查React路由</h2>
        <p>正在检查...</p>
    </div>
    
    <div class="test-section">
        <h2>3. 测试链接</h2>
        <ul>
            <li><a href="/" target="_blank">首页</a></li>
            <li><a href="/login" target="_blank">登录页面</a></li>
            <li><a href="/register" target="_blank">注册页面</a></li>
        </ul>
    </div>
    
    <div class="test-section">
        <h2>4. Cognito直接链接（测试用）</h2>
        <a href="https://us-east-1hu9w7ulqa.auth.us-east-1.amazoncognito.com/signup?client_id=5mae63uesfb6dia5l06ju4j5m0&response_type=code&scope=email+openid+phone+profile&redirect_uri=https%3A%2F%2Fwww.ewltl.com" target="_blank">
            直接访问Cognito注册页面
        </a>
    </div>
    
    <script>
        // 检查React路由
        fetch('/register', { method: 'HEAD' })
            .then(response => {
                const reactCheckDiv = document.getElementById('reactCheck');
                if (response.ok) {
                    reactCheckDiv.className = 'test-section success';
                    reactCheckDiv.innerHTML = `
                        <h2>2. 检查React路由</h2>
                        <p>✅ React路由正常响应（状态码: ${response.status}）</p>
                    `;
                } else {
                    reactCheckDiv.className = 'test-section error';
                    reactCheckDiv.innerHTML = `
                        <h2>2. 检查React路由</h2>
                        <p>❌ React路由响应异常（状态码: ${response.status}）</p>
                        <p>可能需要检查nginx配置</p>
                    `;
                }
            })
            .catch(error => {
                const reactCheckDiv = document.getElementById('reactCheck');
                reactCheckDiv.className = 'test-section error';
                reactCheckDiv.innerHTML = `
                    <h2>2. 检查React路由</h2>
                    <p>❌ 无法访问React路由</p>
                    <p>错误: ${error.message}</p>
                `;
            });
    </script>
</body>
</html>
