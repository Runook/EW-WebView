<!DOCTYPE html>
<html>
<head>
  <title>Cognito连接测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .test-item {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .success { background: #d4edda; border-color: #c3e6cb; }
    .error { background: #f8d7da; border-color: #f5c6cb; }
    .warning { background: #fff3cd; border-color: #ffeaa7; }
    button {
      background: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background: #0056b3; }
    pre {
      background: #f4f4f4;
      padding: 10px;
      border-radius: 3px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>🔧 Cognito连接诊断工具</h1>
  
  <div id="config-info" class="test-item">
    <h3>当前配置</h3>
    <pre id="config-display">加载中...</pre>
  </div>

  <div class="test-item">
    <h3>测试1: Cognito服务可达性</h3>
    <button onclick="testCognitoReachability()">运行测试</button>
    <div id="test1-result"></div>
  </div>

  <div class="test-item">
    <h3>测试2: User Pool存在性</h3>
    <button onclick="testUserPoolExists()">运行测试</button>
    <div id="test2-result"></div>
  </div>

  <div class="test-item">
    <h3>测试3: Cognito托管UI可访问性</h3>
    <button onclick="testHostedUI()">运行测试</button>
    <div id="test3-result"></div>
  </div>

  <div class="test-item">
    <h3>测试4: 生成登录URL</h3>
    <button onclick="generateLoginURL()">生成URL</button>
    <div id="test4-result"></div>
  </div>

  <script>
    // 配置（从你的config文件复制）
    const config = {
      userPoolId: 'us-east-1_HU9W7uLQA',
      clientId: '5mae63uesfb6dia5l06ju4j5m0',
      region: 'us-east-1',
      domain: 'us-east-1hu9w7ulqa'
    };

    // 显示配置
    document.getElementById('config-display').textContent = JSON.stringify(config, null, 2);

    // 测试1: Cognito服务可达性
    async function testCognitoReachability() {
      const resultDiv = document.getElementById('test1-result');
      resultDiv.innerHTML = '<p>测试中...</p>';
      
      try {
        const response = await fetch(`https://cognito-idp.${config.region}.amazonaws.com/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-amz-json-1.1',
            'X-Amz-Target': 'AWSCognitoIdentityProviderService.DescribeUserPool'
          },
          body: JSON.stringify({
            UserPoolId: config.userPoolId
          })
        });
        
        if (response.ok) {
          resultDiv.innerHTML = '<p class="success">✅ Cognito服务可达！</p>';
        } else {
          resultDiv.innerHTML = `<p class="warning">⚠️ 收到响应但状态码: ${response.status}</p>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">❌ 无法连接到Cognito服务<br>错误: ${error.message}</p>`;
      }
    }

    // 测试2: User Pool存在性
    async function testUserPoolExists() {
      const resultDiv = document.getElementById('test2-result');
      resultDiv.innerHTML = '<p>测试中...</p>';
      
      try {
        const response = await fetch(`https://cognito-idp.${config.region}.amazonaws.com/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-amz-json-1.1',
            'X-Amz-Target': 'AWSCognitoIdentityProviderService.DescribeUserPool'
          },
          body: JSON.stringify({
            UserPoolId: config.userPoolId
          })
        });
        
        const data = await response.json();
        
        if (data.UserPool) {
          resultDiv.innerHTML = `<p class="success">✅ User Pool存在！<br>名称: ${data.UserPool.Name}</p>`;
        } else if (data.__type === 'ResourceNotFoundException') {
          resultDiv.innerHTML = '<p class="error">❌ User Pool不存在或ID错误</p>';
        } else {
          resultDiv.innerHTML = `<p class="warning">⚠️ ${data.message || '未知错误'}</p>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">❌ 测试失败<br>错误: ${error.message}</p>`;
      }
    }

    // 测试3: Cognito托管UI
    async function testHostedUI() {
      const resultDiv = document.getElementById('test3-result');
      const hostedUIUrl = `https://${config.domain}.auth.${config.region}.amazoncognito.com`;
      
      resultDiv.innerHTML = `<p>测试URL: ${hostedUIUrl}</p><p>测试中...</p>`;
      
      try {
        const response = await fetch(hostedUIUrl, { method: 'HEAD', mode: 'no-cors' });
        resultDiv.innerHTML = `<p class="success">✅ Cognito托管UI域名可访问</p><p>URL: <a href="${hostedUIUrl}" target="_blank">${hostedUIUrl}</a></p>`;
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">❌ 无法访问托管UI<br>错误: ${error.message}<br><br>可能原因：<br>1. 域名配置错误<br>2. 域名未在AWS创建</p>`;
      }
    }

    // 测试4: 生成登录URL
    function generateLoginURL() {
      const resultDiv = document.getElementById('test4-result');
      
      const redirectUri = window.location.hostname === 'localhost' 
        ? 'http://localhost:3000'
        : 'https://welogx.com';
      
      const baseUrl = `https://${config.domain}.auth.${config.region}.amazoncognito.com`;
      const scope = 'email+openid+phone';
      const loginUrl = `${baseUrl}/login?client_id=${config.clientId}&response_type=code&scope=${scope}&redirect_uri=${encodeURIComponent(redirectUri)}`;
      const signupUrl = `${baseUrl}/signup?client_id=${config.clientId}&response_type=code&scope=${scope}&redirect_uri=${encodeURIComponent(redirectUri)}`;
      
      resultDiv.innerHTML = `
        <p class="success">✅ 登录URL已生成</p>
        <p><strong>登录URL:</strong><br><a href="${loginUrl}" target="_blank">${loginUrl}</a></p>
        <p><strong>注册URL:</strong><br><a href="${signupUrl}" target="_blank">${signupUrl}</a></p>
        <p><strong>回调URL:</strong> ${redirectUri}</p>
        <hr>
        <p><strong>⚠️ 重要提示：</strong></p>
        <ul>
          <li>点击上面的链接测试登录页面是否能打开</li>
          <li>如果显示错误，说明：
            <ul>
              <li>域名配置错误（检查 domain 值）</li>
              <li>App Client配置错误</li>
              <li>回调URL未在AWS中配置</li>
            </ul>
          </li>
          <li>确保在AWS Cognito的App Client设置中配置了回调URL: <code>${redirectUri}</code></li>
        </ul>
      `;
    }

    // 页面加载时自动运行第一个测试
    window.onload = function() {
      testCognitoReachability();
    };
  </script>
</body>
</html>
